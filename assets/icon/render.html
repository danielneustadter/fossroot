<!doctype html>
<!-- Rasterization wrapper: scales fossroot.svg to the viewport so headless
     Chrome can emit any icon size via -\-window-size=N,N -\-screenshot. -->
<html>
<head><style>html,body{margin:0;padding:0;background:transparent}img{display:block;width:100vw;height:100vh}</style></head>
<body><img src="fossroot.svg"></body>
</html>

<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fossroot app icon: the PKI chain of trust drawn as a root system.
       The gold anchor node (root CA) branches downward into intermediate
       nodes, on a navy tile. Original artwork for the Fossroot project. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4166"/>
      <stop offset="1" stop-color="#141F38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5CB5C"/>
      <stop offset="1" stop-color="#DFA32B"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none"
        stroke="#0C1526" stroke-width="8"/>
  <!-- Subtle top sheen -->
  <path d="M118 8h276c60.8 0 110 49.2 110 110v22c-84-34-208-52-248-52S92 106 8 140v-22C8 57.2 57.2 8 118 8Z"
        fill="#FFFFFF" opacity="0.05"/>

  <!-- Root strokes: center taproot plus two laterals, organic curves -->
  <g stroke="url(#gold)" stroke-width="30" stroke-linecap="round" fill="none">
    <!-- taproot -->
    <path d="M256 186 C 256 236, 250 268, 256 340"/>
    <!-- left lateral -->
    <path d="M247 210 C 210 248, 172 262, 158 322"/>
    <!-- right lateral -->
    <path d="M265 210 C 302 248, 340 262, 354 322"/>
    <!-- small rootlets -->
    <path d="M252 268 C 226 286, 214 300, 208 326" stroke-width="18"/>
    <path d="M260 268 C 286 286, 298 300, 304 326" stroke-width="18"/>
  </g>

  <!-- Intermediate-CA nodes at the root tips -->
  <g fill="#F5CB5C" stroke="#0C1526" stroke-width="10">
    <circle cx="158" cy="352" r="30"/>
    <circle cx="354" cy="352" r="30"/>
    <circle cx="256" cy="374" r="34"/>
  </g>
  <g fill="#FBE29B" stroke="none">
    <circle cx="208" cy="342" r="16"/>
    <circle cx="304" cy="342" r="16"/>
  </g>

  <!-- Root-CA anchor node -->
  <circle cx="256" cy="138" r="58" fill="url(#gold)" stroke="#0C1526" stroke-width="12"/>
  <circle cx="256" cy="138" r="26" fill="#141F38"/>
  <circle cx="256" cy="138" r="26" fill="none" stroke="#FBE29B" stroke-width="6"/>
</svg>
